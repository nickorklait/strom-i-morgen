# Daily: fetch tomorrow's prices (out ~13:00), validate them, build the post and publish it to Instagram.
# One job per price area (profile). Only profiles with "publish.enabled" in config/profiles/<p>.json
# and a token secret publish; the others just build their images. Then the publish logs, the price
# cache and the encrypted tokens are committed back to the repo.
name: Strøm i morgen

on:
  schedule:
    # 12:15, 13:15 and 15:15 UTC = 13:15/14:15/16:15 Oslo winter time (14:15/15:15/17:15 summer time).
    # Publishing starts at publish.time (14:00 Oslo); later runs retry if something was late.
    - cron: '15 12,13,15 * * *'
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One area at a time: the jobs commit to the same repo.
      max-parallel: 1
      fail-fast: false
      matrix:
        profile: [no1, no2, no3, no4, no5]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install cloudflared (temporary public URL for the images)
        run: |
          curl -fsSL -o /usr/local/bin/cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.10.2/cloudflared-linux-amd64
          chmod +x /usr/local/bin/cloudflared

      - name: Generate and publish (${{ matrix.profile }})
        env:
          STROM_PROFILE: ${{ matrix.profile }}
          # NO1 uses INSTAGRAM_ACCESS_TOKEN; the other areas INSTAGRAM_ACCESS_TOKEN_NO2 … _NO5.
          INSTAGRAM_ACCESS_TOKEN: ${{ matrix.profile == 'no1' && secrets.INSTAGRAM_ACCESS_TOKEN || secrets[format('INSTAGRAM_ACCESS_TOKEN_{0}', matrix.profile)] }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: npm run autopilot

      - name: Save data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Whole folder: the publish log MUST get pushed, or a post could go out twice.
          git add -A -- data
          if git diff --cached --quiet; then echo "No data changes."; exit 0; fi
          git commit -m "data: daily run ${{ matrix.profile }} $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            sleep 5
          done
          echo "::error::Could not save the publish log."
          exit 1

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: posts-${{ matrix.profile }}
          path: output/${{ matrix.profile }}/
          retention-days: 14
